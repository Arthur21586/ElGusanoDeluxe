<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Gusano Deluxe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b1325;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            color: #4deeea;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }

        .stats-bar {
            background: #111d33;
            border: 1px solid #1f355c;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
        }

        .highlight {
            color: #ffe600;
            font-weight: bold;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        canvas {
            background-color: #050a14;
            border: 2px solid #1f355c;
            border-radius: 8px;
            display: block;
            width: 100%;
            height: auto;
        }

        .controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
            max-width: 400px;
        }

        .btn-row {
            display: flex;
            gap: 5px;
        }

        button {
            background: #00b4d8;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background: #0077b6;
        }

        .dpad-btn {
            width: 50px;
            height: 45px;
            font-size: 1.2rem;
            background: #1f355c;
        }

        .dpad-btn:active {
            background: #4deeea;
            color: #000;
        }

        .hint {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #8d99ae;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🐍 El Gusano Deluxe</h1>

    <div class="stats-bar">
        <div class="stats-row">
            <span>👤 <strong id="player-name">Arturo</strong></span>
            <span>Nivel: <strong id="level-display" class="highlight">1/10 (0/200 pts)</strong></span>
        </div>
        <div class="stats-row">
            <span>Puntos: <strong id="score">0</strong></span>
            <span>Multiplicador: <strong id="multiplier" class="highlight">x1</strong></span>
            <span>💰 Monedas: <strong id="coins" class="highlight">0</strong></span>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="btn-row">
            <button id="btn-start">▶ Iniciar / Reiniciar</button>
            <button id="btn-speed">⚡ Turbo</button>
        </div>

        <!-- Controles en pantalla (D-Pad) -->
        <button class="dpad-btn" onclick="setDirection('UP')">▲</button>
        <div class="btn-row">
            <button class="dpad-btn" onclick="setDirection('LEFT')">◀</button>
            <button class="dpad-btn" onclick="setDirection('RIGHT')">▶</button>
        </div>
        <button class="dpad-btn" onclick="setDirection('DOWN')">▼</button>
    </div>

    <p class="hint">💡 Tip: Puedes usar las flechas del teclado, los botones o **deslizar el dedo (swipe)** en la pantalla para moverte.</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridCount = 20;
        const gridSize = canvas.width / gridCount;

        let snake = [];
        let dx = gridSize;
        let dy = 0;
        let food = { x: 0, y: 0 };
        let poison = { x: -1, y: -1 };
        
        let score = 0;
        let coins = 0;
        let level = 1;
        let pointsInLevel = 0;
        let pointsToNextLevel = 200;
        let multiplier = 1;
        
        let gameInterval = null;
        let isTurbo = false;
        let gameRunning = false;

        // Gestos táctiles
        let touchStartX = 0;
        let touchStartY = 0;

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-speed').addEventListener('click', toggleTurbo);

        // Control por Teclado
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
        });

        // Controles Táctiles por Deslizamiento (Swipe)
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning) return;
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let deltaX = touchEndX - touchStartX;
            let deltaY = touchEndY - touchStartY;

            // Deslizamiento mínimo de 30px para activar giro
            if (Math.abs(deltaX) > 30 || Math.abs(deltaY) > 30) {
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (deltaX > 0 && dx === 0) setDirection('RIGHT');
                    else if (deltaX < 0 && dx === 0) setDirection('LEFT');
                } else {
                    if (deltaY > 0 && dy === 0) setDirection('DOWN');
                    else if (deltaY < 0 && dy === 0) setDirection('UP');
                }
            }
        }, { passive: true });

        function setDirection(dir) {
            if (!gameRunning) return;
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
            if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
        }

        function toggleTurbo() {
            isTurbo = !isTurbo;
            multiplier = isTurbo ? 2 : 1;
            document.getElementById('multiplier').innerText = 'x' + multiplier;
            if (gameRunning) resetTimer();
        }

        function startGame() {
            snake = [
                { x: 5 * gridSize, y: 10 * gridSize },
                { x: 4 * gridSize, y: 10 * gridSize },
                { x: 3 * gridSize, y: 10 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            pointsInLevel = 0;
            level = 1;
            pointsToNextLevel = 200;
            gameRunning = true;

            spawnFood();
            spawnPoison();
            updateUI();
            resetTimer();
        }

        function resetTimer() {
            if (gameInterval) clearInterval(gameInterval);
            let speed = isTurbo ? 70 : 130;
            gameInterval = setInterval(gameLoop, speed);
        }

        function gameLoop() {
            moveSnake();
            if (checkCollision()) {
                gameOver();
                return;
            }
            draw();
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Comer comida normal
            if (head.x === food.x && head.y === food.y) {
                let gained = 20 * multiplier;
                score += gained;
                pointsInLevel += gained;
                coins += 5;
                checkLevelUp();
                spawnFood();
                if (Math.random() < 0.4) spawnPoison();
            } 
            // Comer comida venenosa
            else if (head.x === poison.x && head.y === poison.y) {
                score = Math.max(0, score - 30);
                pointsInLevel = Math.max(0, pointsInLevel - 30);
                poison = { x: -1, y: -1 };
                snake.pop(); // Quita un segmento extra por castigo
                snake.pop();
            } else {
                snake.pop();
            }

            updateUI();
        }

        function checkLevelUp() {
            if (pointsInLevel >= pointsToNextLevel && level < 10) {
                level++;
                pointsInLevel -= pointsToNextLevel;
                pointsToNextLevel += 150;
            }
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * gridCount) * gridSize,
                y: Math.floor(Math.random() * gridCount) * gridSize
            };
        }

        function spawnPoison() {
            poison = {
                x: Math.floor(Math.random() * gridCount) * gridSize,
                y: Math.floor(Math.random() * gridCount) * gridSize
            };
        }

        function checkCollision() {
            const head = snake[0];
            // Paredes
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }
            // Choque consigo mismo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameRunning = false;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff4d4d';
            ctx.font = 'bold 24px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('¡Juego Terminado!', canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Segoe UI';
            ctx.fillText('Puntuación: ' + score, canvas.width / 2, canvas.height / 2 + 20);
        }

        function draw() {
            ctx.fillStyle = '#050a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar comida
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Dibujar veneno
            if (poison.x >= 0) {
                ctx.fillStyle = '#a000ff';
                ctx.fillRect(poison.x + 2, poison.y + 2, gridSize - 4, gridSize - 4);
            }

            // Dibujar gusano
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#4deeea' : '#00b4d8';
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = coins;
            let levelStr = level >= 10 ? '10/10 (MÁX)' : `${level}/10 (${pointsInLevel}/${pointsToNextLevel} pts)`;
            document.getElementById('level-display').innerText = levelStr;
        }

        // Pantalla Inicial
        draw();
        ctx.fillStyle = '#4deeea';
        ctx.font = '18px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Presiona "Iniciar / Reiniciar"', canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
